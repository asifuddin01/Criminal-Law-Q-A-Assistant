[project]
name = "criminal-law-qa-backend"
version = "0.1.0"
description = "Source-grounded Q&A over Bangladesh criminal law"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "httpx>=0.28.1",
    "fastembed>=0.8.0",
    "pdfplumber>=0.11.10",
    # Imported directly by the vector index, and previously relied on arriving
    # through fastembed. A dependency you import is a dependency you declare.
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    # Charting, for the evaluation report only. It is not a runtime dependency:
    # nothing the API imports reaches it, and a serving image has no business
    # carrying a plotting stack.
    "matplotlib>=3.11.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
